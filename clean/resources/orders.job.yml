resources:
  jobs:
    orders:
      name: orders
      tasks:
        - task_key: ingest
          notebook_task:
            notebook_path: ../src/ingest.py
        - task_key: clean
          depends_on:
            - task_key: ingest
          notebook_task:
            notebook_path: ../src/clean.py
            base_parameters:
              schema: sales
        - task_key: publish
          depends_on:
            - task_key: clean
          notebook_task:
            notebook_path: ../src/publish.py
